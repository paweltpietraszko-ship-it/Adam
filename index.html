<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Triangulum</title>
<!--
Zmiany vs poprzednia wersja (index-8.html):
1. BACKEND = window.location.origin — nie trzeba edytować przy zmianie platformy
2. Etykiety certainty wczytywane z /config — jedno źródło prawdy
3. Upload: osobne pole attached_text wysyłane do /ask; backend sandboxuje
4. Progress: fazy symulowane w JS z komunikatami postępu
5. Tag dla CERT_SINGLE i CERT_QUICK — uczciwsze oznaczenia
6. Licznik znaków pytania (limit 10000)
7. Obsługa 429 (budget/rate limit) z czytelnym komunikatem
8. switchMode: jedna funkcja zamiast dwóch inline handlerów
-->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
textarea:focus, input:focus { outline: none; border-color: #4a7ab5 !important; }
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: #4a5a6a; border-radius: 2px; }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triangulum">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body style="background:#111820">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const BACKEND = window.location.origin;

const DEFAULT_LABELS = {
  quick: "TYLKO CLAUDE — BEZ TRIANGULACJI",
  verified_online: "WSPARTE ŹRÓDŁAMI ONLINE",
  high: "WYSOKA",
  medium: "SREDNIA",
  low: "NISKA",
  single: "JEDEN MODEL — TRIANGULACJA NIEMOŻLIWA",
};

const PROGRESS_STAGES = [
  { at: 0,  text: "Inicjuję zapytania..." },
  { at: 3,  text: "Modele AI analizują pytanie..." },
  { at: 15, text: "Porównuję odpowiedzi..." },
  { at: 22, text: "Składam raport..." },
  { at: 40, text: "To trwa dłużej — czekam na ostatnie odpowiedzi..." },
];

function currentStage(elapsed) {
  let s = PROGRESS_STAGES[0].text;
  for (const p of PROGRESS_STAGES) { if (elapsed >= p.at) s = p.text; }
  return s;
}

function certaintyTag(cert, labels) {
  if (!cert) return { text: "brak oceny", color: "#4a5a6a" };
  if (cert === labels.quick) return { text: "⚡ szybka", color: "#5a8aaa" };
  if (cert === labels.verified_online) return { text: "✓ ze źródłami online", color: "#5ab57a" };
  if (cert === labels.high) return { text: "✓ zgodne", color: "#5ab57a" };
  if (cert === labels.medium) return { text: "⚠ częściowe różnice", color: "#b59a5a" };
  if (cert === labels.single) return { text: "⚠ jeden model", color: "#b59a5a" };
  return { text: "✕ modele się różnią", color: "#b06060" };
}

function ReportLine({ text }) {
  if (!text.trim()) return <div style={{ height: 7 }} />;
  const m = text.match(/^\*\*(.+?)\*\*(.*)$/);
  if (m) {
    if (!m[2].trim()) return (
      <div style={{
        fontWeight: 600, color: "#7ab5e8", fontSize: 11,
        letterSpacing: "0.07em", textTransform: "uppercase",
        margin: "20px 0 7px", paddingBottom: 5,
        borderBottom: "1px solid #2a3545"
      }}>{m[1]}</div>
    );
    return (
      <div style={{ fontSize: 14, lineHeight: 1.8, color: "#c8d4e0" }}>
        <span style={{ fontWeight: 600, color: "#dde4ed" }}>{m[1]}</span>{m[2]}
      </div>
    );
  }
  if (text.startsWith("- ")) return (
    <div style={{ fontSize: 13, lineHeight: 1.7, color: "#a0aab8", paddingLeft: 16, position: "relative" }}>
      <span style={{ position: "absolute", left: 0, color: "#4a7ab5" }}>—</span>
      {text.slice(2)}
    </div>
  );
  return <div style={{ fontSize: 14, lineHeight: 1.8, color: "#c8d4e0" }}>{text}</div>;
}

const Tag = ({ c, color }) => (
  <span style={{
    fontFamily: "monospace", fontSize: 9, letterSpacing: "0.1em",
    textTransform: "uppercase",
    color: color || "#4a7ab5",
    padding: "3px 7px",
    border: `1px solid ${color || "#2a3a50"}`,
    borderRadius: 2
  }}>{c}</span>
);

function App() {
  const [q, setQ] = useState("");
  const [stage, setStage] = useState("idle");
  const [sources, setSources] = useState(null);
  const [verificationData, setVerificationData] = useState({});
  const [report, setReport] = useState("");
  const [reportOgolny, setReportOgolny] = useState("");
  const [reportUczen, setReportUczen] = useState("");
  const [falsification, setFalsification] = useState("");
  const [synthLoading, setSynthLoading] = useState(false);
  const [lastQuestion, setLastQuestion] = useState("");
  const [showSrc, setShowSrc] = useState(false);
  const [err, setErr] = useState("");
  const [timing, setTiming] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [adamHistory, setAdamHistory] = useState([]);
  const [adamInput, setAdamInput] = useState("");
  const [mode, setMode] = useState("ogolny");
  const [adamLoading, setAdamLoading] = useState(false);
  const [showDisclaimer, setShowDisclaimer] = useState(() => !localStorage.getItem("triangulum_disclaimer"));
  const [deepScan, setDeepScan] = useState(false);
  const [requestId, setRequestId] = useState(null);
  const [feedback, setFeedback] = useState(null);
  const [citations, setCitations] = useState([]);
  const [uploadText, setUploadText] = useState("");
  const [uploadName, setUploadName] = useState("");
  const [uploadLoading, setUploadLoading] = useState(false);
  const [labels, setLabels] = useState(DEFAULT_LABELS);
  const [cacheHit, setCacheHit] = useState(false);
  const timerRef = useRef(null);
  const adamEndRef = useRef(null);
  const fileInputRef = useRef(null);

  const running = stage === "loading";

  // /config przy starcie — pobierz etykiety z backendu
  useEffect(() => {
    fetch(`${BACKEND}/config`)
      .then(r => r.ok ? r.json() : null)
      .then(data => { if (data && data.certainty_labels) setLabels(data.certainty_labels); })
      .catch(() => {});
  }, []);

  useEffect(() => {
    if (running) {
      setElapsed(0);
      timerRef.current = setInterval(() => setElapsed(e => e + 1), 1000);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [running]);

  useEffect(() => {
    adamEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [adamHistory]);

  async function handleUpload(file) {
    if (!file) return;
    setUploadLoading(true);
    setUploadName(file.name);
    const formData = new FormData();
    formData.append("file", file);
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 30000);
      const res = await fetch(`${BACKEND}/upload`, {
        method: "POST", body: formData, signal: controller.signal
      });
      clearTimeout(timer);
      const data = await res.json();
      if (data.error) { setErr(data.error); setUploadName(""); setUploadText(""); }
      else { setUploadText(data.text || ""); }
    } catch (e) {
      setErr(e.name === "AbortError" ? "Upload przekroczył limit czasu (30s)." : "Błąd uploadu: " + e.message);
      setUploadName(""); setUploadText("");
    }
    setUploadLoading(false);
  }

  async function sendFeedback(rating) {
    if (!requestId || feedback !== null) return;
    setFeedback(rating);
    try {
      await fetch(`${BACKEND}/feedback`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ request_id: requestId, rating })
      });
    } catch (e) {}
  }

  async function run() {
    if (!q.trim()) { setErr("Wpisz pytanie."); return; }
    setErr(""); setSources(null); setReport(""); setReportOgolny(""); setReportUczen(""); setFalsification("");
    setShowSrc(false); setTiming(null); setFeedback(null); setRequestId(null);
    setCitations([]); setCacheHit(false);
    setAdamHistory([]); setAdamInput("");
    setStage("loading");
    const t0 = Date.now();

    try {
      const body = {
        question: q,
        mode,
        deep_scan: deepScan,
        attached_text: uploadText || null,
        attached_name: uploadName || null,
      };
      const res = await fetch(`${BACKEND}/ask`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (res.status === 429) {
        const data = await res.json().catch(() => ({}));
        setErr(data.error || "Limit zapytań osiągnięty. Spróbuj później.");
        setStage("error");
        return;
      }
      if (!res.ok) throw new Error(`Błąd serwera: ${res.status}`);
      const data = await res.json();

      if (data.status === "error" && !data.claude && !data.openai && !data.gemini) {
        throw new Error(data.error || "Nieznany błąd");
      }
      if (data.status === "error") setErr((data.error || "") + " — wyniki mogą być niepełne.");

      setSources({
        a: data.claude || "",
        b: data.openai || "",
        c: data.gemini || "",
        p: data.perplexity || ""
      });
      setVerificationData(data.verification || {});
      setFalsification(data.falsification || "");
      setCitations(data.citations || []);
      setRequestId(data.request_id || null);
      setCacheHit(!!data.cache_hit);
      const og = data.synthesis || "";
      const uc = data.synthesis_uczen || "";
      setReportOgolny(og);
      setReportUczen(uc);
      setReport(mode === "uczen" ? (uc || og) : (og || uc));
      setLastQuestion(q);
      setTiming(((Date.now() - t0) / 1000).toFixed(1));
      setStage("done");
    } catch (e) {
      setErr(e.message);
      setStage("error");
    }
  }

  async function askAdam() {
    if (!adamInput.trim() || adamLoading) return;
    const userMsg = adamInput.trim();
    setAdamInput("");
    setAdamLoading(true);
    const newHistory = [...adamHistory, { role: "user", content: userMsg }];
    setAdamHistory(newHistory);
    try {
      const res = await fetch(`${BACKEND}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: userMsg, context: report, verification: verificationData, history: adamHistory, mode })
      });
      const data = await res.json();
      setAdamHistory([...newHistory, { role: "assistant", content: data.answer || "[brak odpowiedzi]" }]);
    } catch (e) {
      setAdamHistory([...newHistory, { role: "assistant", content: `Błąd połączenia: ${e.message}` }]);
    }
    setAdamLoading(false);
  }

  async function switchMode(newMode) {
    setMode(newMode);
    if (newMode === "ogolny" && reportOgolny) { setReport(reportOgolny); return; }
    if (newMode === "uczen" && reportUczen) { setReport(reportUczen); return; }
    if (stage !== "done" || !lastQuestion) return;
    setSynthLoading(true);
    try {
      const endpoint = requestId ? `${BACKEND}/resynthesize` : `${BACKEND}/ask`;
      const body = requestId
        ? JSON.stringify({ request_id: requestId, mode: newMode })
        : JSON.stringify({ question: lastQuestion, mode: newMode, deep_scan: deepScan });
      const res = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body
      });
      const data = await res.json();
      if (data.status === "error") {
        setErr(data.error || "Nie udało się przełączyć trybu.");
      } else {
        const txt = data.synthesis || "";
        if (newMode === "ogolny") setReportOgolny(txt); else setReportUczen(txt);
        setReport(txt);
      }
    } catch (e) {
      setErr("Błąd połączenia: " + e.message);
    } finally {
      setSynthLoading(false);
    }
  }

  const mono = "'IBM Plex Mono', monospace";
  const sans = "'IBM Plex Sans', sans-serif";
  const certTag = certaintyTag(verificationData && verificationData.certainty, labels);

  return (
    <div style={{ minHeight: "100vh", background: "#111820", color: "#d8dfe8", fontFamily: sans, padding: "28px 18px" }}>

      {showDisclaimer && (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)",
          display: "flex", alignItems: "center", justifyContent: "center",
          zIndex: 1000, padding: 24
        }}>
          <div style={{
            background: "#161e28", border: "1px solid #4a7ab5",
            borderRadius: 6, padding: "28px 30px", maxWidth: 480, width: "100%"
          }}>
            <div style={{ fontFamily: mono, fontSize: 9, letterSpacing: "0.2em", color: "#4a7ab5", textTransform: "uppercase", marginBottom: 14 }}>
              Zanim zaczniesz
            </div>
            <div style={{ fontSize: 14, lineHeight: 1.8, color: "#c8d4e0", marginBottom: 24 }}>
              Triangulum porównuje odpowiedzi kilku modeli AI i ocenia ich zgodność. Wyższa zgodność oznacza mniejsze ryzyko błędu — nie gwarancję prawdy. Przy ważnych decyzjach traktuj wynik jako punkt wyjścia, nie ostateczną odpowiedź.
            </div>
            <button onClick={() => {
              localStorage.setItem("triangulum_disclaimer", "1");
              setShowDisclaimer(false);
            }} style={{
              width: "100%", padding: "12px", borderRadius: 3,
              background: "#0c1a28", border: "1px solid #4a7ab5",
              color: "#7ab5e8", fontFamily: mono,
              fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase",
              cursor: "pointer"
            }}>
              Rozumiem, przejdź do aplikacji
            </button>
          </div>
        </div>
      )}

      <div style={{ maxWidth: 680, margin: "0 auto" }}>

        {/* Header */}
        <div style={{ marginBottom: 30, borderBottom: "1px solid #2a3545", paddingBottom: 18 }}>
          <div style={{ fontFamily: mono, fontSize: 9, letterSpacing: "0.2em", color: "#4a7ab5", textTransform: "uppercase", marginBottom: 4 }}>
            System Weryfikacji Multi-Model
          </div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
            <span style={{ fontSize: 20, fontWeight: 300, color: "#edf2f8", letterSpacing: "-0.02em" }}>
              <img src="icon-192.png" style={{ width: 22, height: 22, marginRight: 6, verticalAlign: "middle", borderRadius: 4 }} />Triangulum <span style={{ fontWeight: 600, color: "#7ab5e8" }}>v3.3</span>
            </span>
            <div style={{ marginLeft: "auto", display: "flex", gap: 4, background: "#0f1419", padding: 2, borderRadius: 4, border: "1px solid #2a3545" }}>
              <button onClick={() => switchMode("ogolny")}
                style={{ padding: "4px 12px", fontSize: 11, fontFamily: mono, border: "none", borderRadius: 2, background: mode === "ogolny" ? "#2a5080" : "transparent", color: mode === "ogolny" ? "#7ab5e8" : "#7a8290", cursor: "pointer" }}>OGÓLNY</button>
              <button onClick={() => switchMode("uczen")}
                style={{ padding: "4px 12px", fontSize: 11, fontFamily: mono, border: "none", borderRadius: 2, background: mode === "uczen" ? "#2a5080" : "transparent", color: mode === "uczen" ? "#7ab5e8" : "#7a8290", cursor: "pointer" }}>UCZEŃ</button>
            </div>
            <span style={{ fontFamily: mono, fontSize: 9, color: "#2a5070", letterSpacing: "0.08em" }}>
              CLAUDE · GPT-4O-MINI · GEMINI · ADAM
            </span>
          </div>
        </div>

        {/* Question */}
        <div style={{ marginBottom: 14 }}>
          <label style={{ display: "block", fontFamily: mono, fontSize: 9, letterSpacing: "0.16em", color: "#4a7ab5", textTransform: "uppercase", marginBottom: 6 }}>
            Pytanie
          </label>
          <textarea
            placeholder="Wpisz pytanie do analizy..."
            value={q} onChange={e => setQ(e.target.value)} rows={3}
            onKeyDown={e => { if (e.key === "Enter" && e.ctrlKey) run(); }}
            style={{
              width: "100%", background: "#161e28", border: "1px solid #2a3545",
              color: "#dde4ed", fontFamily: sans, fontSize: 15,
              padding: "12px 14px", borderRadius: 3, resize: "vertical", lineHeight: 1.5
            }}
          />
          <div style={{ fontFamily: mono, fontSize: 9, color: "#4a5a6a", marginTop: 4, letterSpacing: "0.06em", display: "flex", justifyContent: "space-between" }}>
            <span>Ctrl+Enter aby uruchomić</span>
            <span style={{ color: q.length > 9500 ? "#b06060" : "#4a5a6a" }}>{q.length} / 10000</span>
          </div>
        </div>

        {/* Upload pliku */}
        <div style={{ marginBottom: 12 }}>
          <input ref={fileInputRef} type="file" accept=".pdf,.txt,.md" style={{ display: "none" }}
            onChange={e => handleUpload(e.target.files[0])} />
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <button onClick={() => fileInputRef.current?.click()} disabled={uploadLoading} style={{
              background: "none", border: "1px solid #2a3545", color: "#4a7ab5",
              fontFamily: mono, fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase",
              padding: "5px 12px", borderRadius: 2, cursor: "pointer"
            }}>
              {uploadLoading ? "▸ Wczytuję..." : "+ Dodaj plik"}
            </button>
            {uploadName && (
              <span style={{ fontFamily: mono, fontSize: 9, color: "#5a8aaa" }}>
                📄 {uploadName} ({uploadText.length} znaków)
              </span>
            )}
            {uploadName && (
              <button onClick={() => { setUploadText(""); setUploadName(""); }} style={{
                background: "none", border: "none", color: "#4a5a6a",
                fontFamily: mono, fontSize: 9, cursor: "pointer"
              }}>✕</button>
            )}
          </div>
          <div style={{ fontFamily: mono, fontSize: 9, color: "#2a3a50", marginTop: 3, letterSpacing: "0.06em" }}>
            PDF · TXT · MD · max 5MB
          </div>
        </div>

        {/* Rentgen toggle + button */}
        <div style={{ display: "flex", gap: 8, marginBottom: 22, alignItems: "stretch" }}>
          <button onClick={run} disabled={running} style={{
            flex: 1, padding: "14px", borderRadius: 3,
            cursor: running ? "not-allowed" : "pointer",
            background: running ? "#2a3a50" : "#0c1a28",
            border: `1px solid ${running ? "#2a3a50" : "#4a7ab5"}`,
            color: running ? "#2a5070" : "#7ab5e8",
            fontFamily: mono, fontSize: 10, letterSpacing: "0.2em",
            textTransform: "uppercase", transition: "all 0.15s"
          }}>
            {running ? "▸ Analizuję..." : "▸ Uruchom analizę"}
          </button>
          <button onClick={() => setDeepScan(!deepScan)} style={{
            padding: "14px 16px", borderRadius: 3, cursor: "pointer",
            background: deepScan ? "#1a3a20" : "#0c1a28",
            border: `1px solid ${deepScan ? "#3a7a4a" : "#2a3545"}`,
            color: deepScan ? "#5ab57a" : "#4a5a6a",
            fontFamily: mono, fontSize: 9, letterSpacing: "0.12em",
            textTransform: "uppercase", transition: "all 0.15s", whiteSpace: "nowrap"
          }} title="Pełna triangulacja z Perplexity i cytowaniem źródeł">
            {deepScan ? "🔬 RENTGEN ON" : "🔬 RENTGEN"}
          </button>
        </div>

        {/* Progress */}
        {running && (
          <div style={{
            background: "#161e28", border: "1px solid #2a3545",
            borderRadius: 3, marginBottom: 16, overflow: "hidden"
          }}>
            <div style={{ height: 2, background: "#111820" }}>
              <div style={{
                height: "100%", background: "linear-gradient(90deg, #2a5080, #7ab5e8)",
                borderRadius: 1, width: `${Math.min(95, elapsed * 3)}%`,
                transition: "width 1s linear"
              }} />
            </div>
            <div style={{
              padding: "8px 14px", display: "flex",
              justifyContent: "space-between", alignItems: "center"
            }}>
              <div style={{ fontFamily: mono, fontSize: 10, color: "#5a8aaa", letterSpacing: "0.04em" }}>
                ▸ {currentStage(elapsed)}
              </div>
              <div style={{ fontFamily: mono, fontSize: 10, color: "#4a7ab5" }}>
                {elapsed}s
              </div>
            </div>
          </div>
        )}

        {/* Error */}
        {err && (
          <div style={{
            background: "#150a0a", border: "1px solid #3a1515",
            color: "#b06060", padding: "11px 14px", borderRadius: 3,
            fontFamily: mono, fontSize: 11, marginBottom: 18, lineHeight: 1.6
          }}>
            ✕ {err}
          </div>
        )}

        {/* Synth loading (przełączanie trybu) */}
        {synthLoading && (
          <div style={{ fontFamily: mono, fontSize: 10, color: "#5a8aaa", padding: "10px 0", letterSpacing: "0.04em" }}>
            ▸ Generuję drugi tryb...
          </div>
        )}

        {/* Report */}
        {stage === "done" && report && (
          <div>
            <div style={{
              background: "#161e28", border: "1px solid #2a3545",
              borderLeft: "2px solid #2a5080", borderRadius: 4, padding: "24px 26px"
            }}>
              {report.split("\n").map((line, i) => <ReportLine key={i} text={line} />)}

              <div style={{
                display: "flex", alignItems: "center", flexWrap: "wrap", gap: 6,
                marginTop: 20, paddingTop: 14, borderTop: "1px solid #2a3545"
              }}>
                <Tag c={`${verificationData.models_count || 0} ${verificationData.models_count === 1 ? "model" : "modele"}`} />
                {verificationData.certainty && (
                  <Tag c={certTag.text} color={certTag.color} />
                )}
                {cacheHit && <Tag c="⚡ z cache" color="#5a8aaa" />}
                {timing && <Tag c={`${timing}s`} />}
                {deepScan && <Tag c="🔬 rentgen" color="#5ab57a" />}

                {requestId && (
                  <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                    <button onClick={() => sendFeedback(1)} style={{
                      background: feedback === 1 ? "#1a3a20" : "none",
                      border: `1px solid ${feedback === 1 ? "#3a7a4a" : "#2a3545"}`,
                      color: feedback === 1 ? "#5ab57a" : "#4a5a6a",
                      padding: "3px 8px", borderRadius: 2, cursor: "pointer", fontSize: 12
                    }}>👍</button>
                    <button onClick={() => sendFeedback(-1)} style={{
                      background: feedback === -1 ? "#3a1515" : "none",
                      border: `1px solid ${feedback === -1 ? "#7a3a3a" : "#2a3545"}`,
                      color: feedback === -1 ? "#b06060" : "#4a5a6a",
                      padding: "3px 8px", borderRadius: 2, cursor: "pointer", fontSize: 12
                    }}>👎</button>
                  </div>
                )}

                <div style={{ marginLeft: "auto", display: "flex", gap: 6 }}>
                  <button onClick={() => {
                    const ts = new Date().toLocaleString("pl-PL").replace(/[,:\/\s]/g, "-");
                    const adamTxt = adamHistory.length > 0
                      ? "\n\n---\nROZMOWA Z ADAMEM\n" + adamHistory.map(m => (m.role === "user" ? "TY: " : "ADAM: ") + m.content).join("\n\n")
                      : "";
                    const src = sources
                      ? "\n\n---\nCLAUDE:\n" + sources.a
                        + "\n\nGPT-4O-MINI:\n" + sources.b
                        + (sources.c && !sources.c.startsWith("[") ? "\n\nGEMINI:\n" + sources.c : "")
                        + (sources.p && !sources.p.startsWith("[") ? "\n\nPERPLEXITY:\n" + sources.p : "")
                      : "";
                    const cits = citations && citations.length
                      ? "\n\n---\nŹRÓDŁA PERPLEXITY:\n" + citations.map((c, i) => `[${i+1}] ${c}`).join("\n")
                      : "";
                    const txt = "PYTANIE: " + lastQuestion + "\n\n" + report + adamTxt + cits + src;
                    const a = document.createElement("a");
                    a.href = "data:text/plain;charset=utf-8," + encodeURIComponent(txt);
                    a.download = "triangulum_" + ts + ".txt";
                    a.click();
                  }} style={{
                    background: "none", border: "1px solid #2a3a50", color: "#4a7ab5",
                    fontFamily: mono, fontSize: 9, letterSpacing: "0.1em",
                    textTransform: "uppercase", padding: "3px 10px",
                    cursor: "pointer", borderRadius: 2
                  }}>Eksport</button>
                  <button onClick={() => setShowSrc(!showSrc)} style={{
                    background: "none", border: "1px solid #2a3545", color: "#4a7ab5",
                    fontFamily: mono, fontSize: 9, letterSpacing: "0.1em",
                    textTransform: "uppercase", padding: "3px 10px",
                    cursor: "pointer", borderRadius: 2
                  }}>
                    {showSrc ? "Ukryj źródła" : "Pokaż źródła"}
                  </button>
                </div>
              </div>
            </div>

            {/* Citations z Perplexity */}
            {citations && citations.length > 0 && (
              <div style={{
                background: "#131b26", border: "1px solid #2a3545",
                borderLeft: "2px solid #3a7a4a", borderRadius: 3,
                padding: "12px 16px", marginTop: 8
              }}>
                <div style={{ fontFamily: mono, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", color: "#5ab57a", marginBottom: 8 }}>
                  Źródła (Perplexity)
                </div>
                {citations.map((c, i) => (
                  <div key={i} style={{ fontSize: 11, lineHeight: 1.6, color: "#5a8aaa" }}>
                    [{i+1}] <a href={c} target="_blank" rel="noopener noreferrer" style={{ color: "#4a7ab5" }}>{c}</a>
                  </div>
                ))}
              </div>
            )}

            {/* Falsyfikacja */}
            {falsification && falsification.length > 0 && mode !== "uczen" && (
              <div style={{
                background: "#1a1510", border: "1px solid #3a2a15",
                borderLeft: "2px solid #b07030", borderRadius: 3,
                padding: "14px 18px", marginTop: 8
              }}>
                <div style={{ fontFamily: mono, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", color: "#b07030", marginBottom: 10 }}>
                  Zastrzeżenia do syntezy
                </div>
                <div style={{ fontSize: 13, lineHeight: 1.8, color: "#c0a880", whiteSpace: "pre-wrap" }}>
                  {falsification}
                </div>
              </div>
            )}

            {/* Sources */}
            {showSrc && sources && (
              <div style={{ display: "grid", gridTemplateColumns: `repeat(${[sources.a, sources.b, sources.c && !sources.c.startsWith('['), sources.p && !sources.p.startsWith('[')].filter(Boolean).length || 1}, 1fr)`, gap: 8, marginTop: 10 }}>
                {[
                  sources.a ? { name: "Claude", text: sources.a } : null,
                  sources.b ? { name: "GPT-4o-mini", text: sources.b } : null,
                  sources.c && !sources.c.startsWith('[') ? { name: "Gemini", text: sources.c } : null,
                  sources.p && !sources.p.startsWith('[') ? { name: "Perplexity", text: sources.p } : null
                ].filter(Boolean).map(s => (
                  <div key={s.name} style={{
                    background: "#131b26", border: "1px solid #2a3545",
                    borderRadius: 3, padding: "13px 14px"
                  }}>
                    <div style={{ fontFamily: mono, fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", color: "#4a7ab5", marginBottom: 8 }}>
                      {s.name}
                    </div>
                    <div style={{ fontSize: 11, lineHeight: 1.65, color: "#8090a0", whiteSpace: "pre-wrap" }}>{s.text}</div>
                  </div>
                ))}
              </div>
            )}

            {/* ADAM */}
            <div style={{ marginTop: 16 }}>
              <div style={{
                background: "#131b26", border: "1px solid #2a3545",
                borderLeft: "2px solid #4a7ab5", borderRadius: 4
              }}>
                <div style={{
                  padding: "12px 18px", borderBottom: "1px solid #2a3545",
                  display: "flex", alignItems: "center", gap: 8
                }}>
                  <div style={{ fontFamily: mono, fontSize: 9, letterSpacing: "0.2em", textTransform: "uppercase", color: "#7ab5e8" }}>
                    ADAM
                  </div>
                  <div style={{ fontFamily: mono, fontSize: 9, color: "#2a5070", letterSpacing: "0.06em" }}>
                    pogłęb temat · zapytaj o szczegóły
                  </div>
                </div>

                {adamHistory.length > 0 && (
                  <div style={{ padding: "14px 18px", display: "flex", flexDirection: "column", gap: 12 }}>
                    {adamHistory.map((msg, i) => (
                      <div key={i} style={{ alignSelf: msg.role === "user" ? "flex-end" : "flex-start", maxWidth: "85%" }}>
                        <div style={{
                          fontSize: 9, fontFamily: mono, letterSpacing: "0.1em",
                          textTransform: "uppercase",
                          color: msg.role === "user" ? "#4a7ab5" : "#4a8a5a",
                          marginBottom: 4
                        }}>
                          {msg.role === "user" ? "Ty" : "Adam"}
                        </div>
                        <div style={{
                          fontSize: 13, lineHeight: 1.7,
                          color: msg.role === "user" ? "#a0aab8" : "#c8d4e0",
                          background: msg.role === "user" ? "#2a3a50" : "transparent",
                          padding: msg.role === "user" ? "8px 12px" : "0",
                          borderRadius: 3,
                          whiteSpace: "pre-wrap"
                        }}>
                          {msg.content}
                        </div>
                      </div>
                    ))}
                    {adamLoading && (
                      <div style={{ fontFamily: mono, fontSize: 10, color: "#4a7ab5", letterSpacing: "0.06em" }}>
                        Adam pisze...
                      </div>
                    )}
                    <div ref={adamEndRef} />
                  </div>
                )}

                <div style={{
                  padding: "12px 18px",
                  borderTop: adamHistory.length > 0 ? "1px solid #2a3545" : "none",
                  display: "flex", gap: 8
                }}>
                  <input
                    type="text"
                    placeholder="Zapytaj Adama o szczegóły..."
                    value={adamInput}
                    onChange={e => setAdamInput(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") askAdam(); }}
                    style={{
                      flex: 1, background: "#161e28", border: "1px solid #2a3545",
                      color: "#dde4ed", fontFamily: sans, fontSize: 14,
                      padding: "10px 12px", borderRadius: 3
                    }}
                  />
                  <button onClick={askAdam} disabled={adamLoading || !adamInput.trim()} style={{
                    background: "#0c1a28", border: "1px solid #4a7ab5",
                    color: "#7ab5e8", fontFamily: mono, fontSize: 10,
                    letterSpacing: "0.15em", textTransform: "uppercase",
                    padding: "10px 14px", borderRadius: 3, cursor: "pointer",
                    opacity: adamLoading || !adamInput.trim() ? 0.4 : 1,
                    transition: "all 0.15s", whiteSpace: "nowrap"
                  }}>
                    ▸ Wyślij
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>

</body>
</html>
