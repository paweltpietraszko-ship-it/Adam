function ReportLine({ text }) {
  if (!text.trim()) return <div style={{ height: 7 }} />;
  const m = text.match(/^\*\*(.+?)\*\*(.*)$/);
  if (m) {
    if (!m[2].trim()) return (
      <div style={{
        fontWeight: 600, color: "#5b9bd5", fontSize: 11,
        letterSpacing: "0.07em", textTransform: "uppercase",
        margin: "20px 0 7px", paddingBottom: 5,
        borderBottom: "1px solid #1a1f26"
      }}>{m[1]}</div>
    );
    return (
      <div style={{ fontSize: 14, lineHeight: 1.8, color: "#b0b8c4" }}>
        <span style={{ fontWeight: 600, color: "#c8cdd6" }}>{m[1]}</span>{m[2]}
      </div>
    );
  }
  if (text.startsWith("- ")) return (
    <div style={{ fontSize: 13, lineHeight: 1.7, color: "#8a96a4", paddingLeft: 16, position: "relative" }}>
      <span style={{ position: "absolute", left: 0, color: "#2d4a6e" }}>—</span>
      {text.slice(2)}
    </div>
  );
  return <div style={{ fontSize: 14, lineHeight: 1.8, color: "#b0b8c4" }}>{text}</div>;
}
